# Optional local services for the integration layer:  docker compose up
#   n8n       http://localhost:5678  import integration/n8n/myob_to_snowflake_local.json
# The mock MYOB API runs on the host:  uvicorn integration.mock_api:app --port 8000
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports: ["5678:5678"]
    environment: [GENERIC_TIMEZONE=Australia/Sydney, TZ=Australia/Sydney]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./.n8n_data:/home/node/.n8n"]
