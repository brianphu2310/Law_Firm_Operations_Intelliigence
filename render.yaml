# Public host for the mock vendor API (MYOB, LEAP, triConvey, InfoTrack, PEXA) so n8n Cloud can reach it.
# Render free plan: render.com > New > Blueprint > this repo. The service sleeps after ~15 min idle (first call ~1 min).
# Tokens come from Auth0; this API only verifies them against Auth0's JWKS. All data is simulated.
services:
  - type: web
    name: law-firm-mock-api
    runtime: python
    plan: free
    buildCommand: pip install fastapi uvicorn python-multipart PyJWT cryptography requests
    startCommand: uvicorn integration.mock_api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: AUTH_MODE
        value: auth0
      - key: AUTH0_DOMAIN
        value: dev-z1apvxcaj6hhb84a.us.auth0.com
      - key: AUTH_AUDIENCE
        value: https://myob-mock.dagostino-demo
