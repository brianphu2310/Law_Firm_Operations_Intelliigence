name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build warehouse, run data-quality suite and analysis queries
        run: |
          python -m warehouse.build
          python -m warehouse.quality --db warehouse.db
          python sql/run_queries.py --db warehouse.db
