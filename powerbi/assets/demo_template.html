<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Law Firm Decision Support · Power BI preview</title>
<style>
  :root { --teal:#0a8496; --ink:#0f172a; --muted:#64748b; --line:#dbe6ee; --bg:#f3f6fa; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family:"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color:var(--ink); background:#e9eef4; }
  .app { display:grid; grid-template-rows: 32px 1fr 30px; grid-template-columns: 1fr; height:100vh; }
  .top { grid-column: 1 / -1; background:#252423; color:#fff; display:flex; align-items:center; gap:12px; padding:0 14px; font-size:13px; }
  .top .logo { width:20px; height:20px; display:grid; grid-template-columns:repeat(3,1fr); gap:2px; align-items:end; }
  .top .logo i { background:#f2c811; display:block; border-radius:1px; }
  .top .name { font-weight:600; }
  .top .note { margin-left:auto; color:#c8c6c4; font-size:12px; }
  .rotate { display:none; position:absolute; top:14px; left:0; right:0; text-align:center; font-size:13px; color:#475569; }
  @media (max-width: 700px) and (orientation: portrait) { .rotate { display:block; } }
  @media (max-width: 900px) { .top .note, .top .name + span { display:none; } }
  .pages { background:#faf9f8; border-right:1px solid #e1dfdd; overflow:auto; padding:8px 0; }
  .pages h4 { margin:4px 14px 8px; font-size:12px; color:#605e5c; font-weight:600; }
  .pages a { display:block; padding:7px 14px; font-size:12.5px; color:#323130; cursor:pointer; border-left:3px solid transparent; text-decoration:none; }
  .pages a:hover { background:#f3f2f1; }
  .pages a.on { background:#edebe9; border-left-color:var(--teal); font-weight:600; }
  .stage { overflow:hidden; display:flex; align-items:center; justify-content:center; background:#e9eef4; position:relative; }
  .canvas { width:1280px; height:720px; position:relative; background:var(--bg); transform-origin: 0 0; position:absolute; box-shadow:0 2px 12px rgba(0,0,0,.12); }
  .tabs { grid-column: 1 / -1; background:#faf9f8; border-top:1px solid #e1dfdd; display:flex; gap:2px; overflow-x:auto; padding:0 6px; align-items:stretch; }
  .tabs a { font-size:11.5px; padding:6px 12px; color:#323130; cursor:pointer; white-space:nowrap; border-top:3px solid transparent; }
  .tabs a.on { border-top-color:#f2c811; background:#fff; font-weight:600; }
  .v { position:absolute; overflow:hidden; }
  .box { background:#fff; border:1px solid var(--line); border-radius:12px; }
  .vt { font-size:11pt; font-weight:600; padding:8px 10px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vs { font-size:8.5pt; color:var(--muted); padding:1px 10px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .body { position:absolute; left:0; right:0; bottom:0; }
  .card { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; padding:2px 4px; }
  .card .val { font-weight:700; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .card .lab { color:var(--muted); font-size:8.5pt; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .card.text .val { font-weight:400; white-space:normal; line-height:1.3; text-align:left; font-size:8.5pt; overflow:auto; }
  .card.text { align-items:flex-start; justify-content:flex-start; padding:6px 8px; }
  .card.text .lab { order:-1; margin:0 0 4px; font-weight:600; color:var(--ink); }
  table.t { width:100%; border-collapse:collapse; font-size:8pt; }
  table.t th { position:sticky; top:0; background:#fff; color:var(--muted); font-weight:600; text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.t td { padding:3px 6px; border-bottom:1px solid #eef2f6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
  table.t td.n, table.t th.n { text-align:right; }
  table.t tr.tot td { font-weight:700; border-top:1px solid #cbd5e1; }
  .scroll { overflow:auto; position:absolute; inset:0; padding:0 4px 4px; }
  .sl { display:flex; flex-direction:column; justify-content:center; height:100%; padding:2px 6px; }
  .sl label { font-size:8pt; color:var(--muted); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sl select { font:inherit; font-size:9pt; border:1px solid #c8d3dc; border-radius:4px; padding:3px 4px; background:#fff; width:100%; color:var(--ink); }
  .sl select:disabled { background:#f8fafc; color:#334155; }
  .sl select.changed { border-color:var(--teal); background:#e0f2f4; font-weight:600; }
  .tiles { display:flex; gap:4px; height:100%; align-items:center; flex-wrap:nowrap; overflow:hidden; }
  .tiles button { flex:1 1 auto; font:inherit; font-size:8.5pt; border:1px solid #c8d3dc; background:#fff; color:var(--ink); border-radius:5px; height:26px; padding:0 6px; cursor:pointer; white-space:nowrap; }
  .tiles button.on { background:var(--teal); color:#fff; border-color:var(--teal); }
  .btn { display:flex; align-items:center; justify-content:center; height:100%; border-radius:6px; cursor:pointer; font-size:10pt; user-select:none; white-space:nowrap; overflow:hidden; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:7.5pt; color:#334155; padding:2px 10px 0; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle; }
  svg text { font-family:"Segoe UI", system-ui, sans-serif; }
  .tip { position:fixed; pointer-events:none; background:#252423; color:#fff; font-size:11px; padding:5px 8px; border-radius:4px; display:none; z-index:9; white-space:nowrap; }
  .banner { position:absolute; left:12px; bottom:10px; font-size:11px; color:#605e5c; background:#fff; border:1px solid #e1dfdd; border-radius:6px; padding:4px 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo"><i style="height:8px"></i><i style="height:13px"></i><i style="height:18px"></i></div>
    <span class="name">LawFirmDecisionSupport</span><span style="color:#c8c6c4">· Report preview</span>
    <span class="note">Preview of the Power BI report built from its own page files · sample data · Simulator runs live in the browser</span></div>
  <div class="stage" id="stage"><div class="rotate">↻ Turn your phone sideways for a bigger view</div><div class="canvas" id="canvas"></div></div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="tip" id="tip"></div>
<script>
const D = /*DATA*/;
const PAL = ["#0a8496","#2f7fd8","#6b5bd6","#f2b134","#e2665a","#34a37a","#94a3b8","#d946ef","#0e7490","#b45309"];
const state = { page: D.pages[0].name, period: D.defaultPeriod, preset: "Today", platform: D.defaultPlatform,
                levers: JSON.parse(JSON.stringify(D.sim.presets.Today)), goalTarget: D.sim.targets[0], uplift: 0 };
const $ = s => document.querySelector(s);
const tip = $("#tip");

function lit(o){ try { return o.expr.Literal.Value.replace(/^'|'$/g,"").replace(/''/g,"'"); } catch(e){ return undefined; } }
function num(o){ const v = lit(o); return v===undefined ? undefined : parseFloat(v); }
function prop(objs, name, key){ try { return objs[name][0].properties[key]; } catch(e){ return undefined; } }
function colorOf(c){ try { return lit(c.solid.color); } catch(e){ return undefined; } }

function fmt(v, k, compact){
  if (v === null || v === undefined || (typeof v === "number" && !isFinite(v))) return "";
  if (typeof v !== "number") {
    if (k === "month" || k === "date") { const d = new Date(v); if (!isNaN(d)) return k==="month" ? d.toLocaleDateString("en-AU",{month:"short",year:"2-digit"}) : d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"}); }
    return String(v);
  }
  const a = Math.abs(v), s = v < 0 ? "-" : "";
  switch (k) {
    case "money":
      if (compact && a >= 1e6) return s + "$" + (a/1e6).toFixed(a>=1e7?1:2) + "M";
      if (compact && a >= 1e3) return s + "$" + (a/1e3).toFixed(0) + "K";
      return s + "$" + Math.round(a).toLocaleString("en-AU");
    case "pct1": return (v*100).toFixed(1) + "%";
    case "pct0": return (v*100).toFixed(0) + "%";
    case "num1s": return (v > 0 ? "+" : "") + v.toFixed(1);
    case "num1": return v.toLocaleString("en-AU",{minimumFractionDigits:1,maximumFractionDigits:1});
    case "num2": return v.toFixed(2);
    case "num4": return v.toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:4});
    case "x": return v.toFixed(1) + "x";
    case "text": return String(v);
    default:
      if (compact && a >= 1e6) return s + (a/1e6).toFixed(1) + "M";
      if (compact && a >= 1e4) return s + (a/1e3).toFixed(0) + "K";
      return Math.round(v).toLocaleString("en-AU");
  }
}
function guessKind(name, v){ return typeof v === "number" ? "num" : "text"; }

// ---------------------------------------------------------------------------------------------- navigation ---
function render(){
  SIMM = null;
  const page = D.pages.find(p => p.name === state.page);
  const sec = page.section;
  document.querySelectorAll(".pages a, .tabs a").forEach(a => { const pg = D.pages.find(x => x.name === a.dataset.p);
    a.classList.toggle("on", a.dataset.p === state.page || (page.hidden && pg && pg.section === sec)); });
  const cv = $("#canvas"); cv.innerHTML = "";
  page.visuals.forEach(v => cv.appendChild(visual(v)));
  fit();
}
function go(name){ state.page = name; render(); }
function fit(){
  const st = $("#stage"); const s = Math.min((st.clientWidth-12)/1280, (st.clientHeight-12)/720);
  const c = $("#canvas"); c.style.transform = `scale(${s})`;
  c.style.left = Math.max(0, (st.clientWidth - 1280 * s) / 2) + "px"; c.style.top = Math.max(0, (st.clientHeight - 720 * s) / 2) + "px";
}
window.addEventListener("resize", fit);
D.pages.forEach(p => {
  if (p.hidden) return;
  const b = document.createElement("a"); b.textContent = p.display; b.dataset.p = p.name; b.onclick = () => go(p.name); $("#tabs").appendChild(b);
});

function dataFor(v){
  if (v.live) return liveData(v);
  if (!v.by) return v.data;
  const key = v.by === "period" ? state.period : v.by === "preset" ? (state.preset || "Today") : state.platform;
  return v.data[key];
}

// ------------------------------------------------------------------------- simulator (formulas from sim_spec.py) ---
const SIM = D.sim;
const H = {
  ramp_sum(m, R){ const n = Math.min(m, Math.floor(R)); return n * (n + 1) / (2 * R) + (m - n); },
  payback(L, F, R, C){ for (let m = 1; m <= 60; m++) if (-L + F * H.ramp_sum(m, R) - C * m >= 0) return m; return null; },
  nes_redundancy(y){ let o = 0; SIM.nes.forEach(([t, w]) => { if (y >= t) o = w; }); return o; },
  lk(t, col, key){ const tb = SIM.tables[t]; const r = tb.rows.find(r => r[0] === key); return r ? r[1 + tb.cols.indexOf(col)] : null; },
};
const simFormulas = new Function("x", "H", SIM.formulas + "\nreturn x;");
function simEval(st, d){
  const x = Object.assign({}, SIM.consts, {D: d === undefined ? 1 : d});
  for (const k in st) if (k.startsWith("sim_")) { const v = st[k]; x["L_" + k.slice(4)] = typeof v === "boolean" ? (v ? 1 : 0) : v; }
  return simFormulas(x, H);
}
function money(v, sign){ if (v === null || v === undefined) return ""; const s = v < 0 ? "-" : (sign && v > 0 ? "+" : ""); return s + "$" + Math.round(Math.abs(v)).toLocaleString("en-US"); }
const pct = (v, n) => (v * 100).toFixed(n) + "%";
const sgn1 = v => (v >= 0 ? "+" : "") + v.toFixed(1);
function solve(fn, lo, hi, target){
  if (fn(lo) >= target) return lo; if (fn(hi) < target) return null;
  for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (fn(mid) >= target) hi = mid; else lo = mid; }
  return hi;
}
function rateToFund(st){
  const target = simEval({...st, sim_pay_fe: 0, sim_pay_support: 0}).op1;
  const x = solve(v => simEval({...st, sim_rate: v}).op1, st.sim_rate, 30, target);
  return x === null ? null : x - st.sim_rate;
}
let SIMM = null;
function simM(){
  if (SIMM) return SIMM;
  const st = state.levers, e = simEval(st), C = SIM.consts, today = simEval(SIM.presets.Today).op1, M = {};
  const arrow = v => v > 0 ? "▲ +" : (v < 0 ? "▼ " : "");
  M["Sim Operating Profit"] = () => e.op1;
  M["Sim Margin"] = () => e.margin1;
  M["Sim Gap to Budget"] = () => e.gap_budget;
  M["Sim One-off Cash"] = () => e.one_off;
  M["Sim Low Point"] = () => e.low1;
  M["Sim Profit Caption"] = () => { const v = Math.round(e.op1 - today); return `${arrow(v)}${(v / Math.abs(today) * 100).toFixed(1)}% vs base · ${money(v, true)} vs today`; };
  M["Sim Margin Caption"] = () => { const d = Math.round((e.margin1 - e.margin0) * 10000) / 100; return `${arrow(d)}${d.toFixed(1)} pp vs base · base ${pct(e.margin0, 1)}`; };
  M["Sim Gap Caption"] = () => `budget profit ${money(C.BUDGET_OP)}`;
  M["Sim Low Caption"] = () => `today ${money(C.LOW0)} · minimum ${money(C.MIN_CASH)}`;
  const steps = {"Today's profit": "op0", "Fees": "bridge_fees", "Disb. recovery": "bridge_disb", "Costs": "bridge_costs"};
  M["Sim Bridge Value"] = c => e[steps[c]];
  const dl = {"100% delivered": 1, "75% delivered": 0.75, "50% delivered": 0.5};
  M["Sim Profit at Delivery"] = c => simEval(st, dl[c]).op1;
  M["Sim Scenario Summary"] = () => {
    const parts = [];
    SIM.levers.forEach(lv => { const v = st[lv.key], d = SIM.presets.Today[lv.key]; if (v === d) return;
      if (lv.kind === "cat") parts.push(`${lv.label}: ${v}`);
      else if (lv.kind === "bool") parts.push(`${lv.label}: ${v ? "yes" : "no"}`);
      else parts.push(`${lv.label}: ` + (lv.fmt.includes("$") ? money(v) : (lv.step !== Math.floor(lv.step) || lv.lo < 0 ? sgn1(v) : v.toFixed(0)))); });
    return parts.join(" · ") || "No change: today's firm, last 12 months";
  };
  M["Sim Warning"] = () => {
    const w = [];
    if (e.low1 < C.MIN_CASH) w.push("This takes the account below the $60K minimum balance. Fund it first: lower partner drawings, a loan, or stage the spend.");
    if (e.util1 > 0.95 || e.team_util > 0.95) w.push("Utilisation above about 95% is rarely sustainable: check burnout and quality risk.");
    if (e.mkt_capped) w.push("The team cannot take all the new work: the extra fees stop at 95% utilisation. Pair the campaign with a hire.");
    if (e.pay_cost !== 0 && Math.min(st.sim_pay_fe, st.sim_pay_support) < 3.4) w.push("Below market wage growth (3.4%, ABS WPI): expect retention risk. Pay cuts generally need agreement and cannot go below award minimums.");
    if (st.sim_cut_fe > 0 && e.fees_cut > e.cut_saving) w.push("The fee earner(s) leaving bill more than they cost: this cut lowers profit.");
    return w.join(" ") || "No warnings for this scenario.";
  };
  M["Sim Effect"] = L => {
    const sm = v => money(v, true), pb = v => v === null ? "not within 5 years" : `${v} months`, n0 = v => Math.round(v).toLocaleString("en-US");
    const rows = {
      "Billable hours a year": () => `${n0(C.H0)} → ${n0(e.hours_tot)}`,
      "Utilisation": () => `${pct(C.UTIL0, 1)} → ${pct(e.util1, 1)}`,
      "New hire(s): fees − cost, year one": () => st.sim_hires > 0 && sm(e.hire_net),
      "Productivity a hire needs to break even": () => st.sim_hires > 0 && pct(e.hire_breakeven_ramp, 0),
      "Support staff added: cost less fees freed": () => st.sim_add_support > 0 && sm(e.fees_para - e.support_added_cost),
      "Pay review: cost a year": () => e.pay_cost !== 0 && sm(-e.pay_cost),
      "Rate increase that would pay for it": () => { if (e.pay_cost === 0) return null; const r = rateToFund(st); return r === null ? "more than +30%" : `+${r.toFixed(1)}%`; },
      "Marketing: extra spend a year": () => e.mkt_spend > 0 && sm(-e.mkt_spend),
      "Extra inquiries → new matters": () => e.mkt_spend > 0 && `${e.mkt_inq.toFixed(0)} → ${e.mkt_matters.toFixed(0)}`,
      "Fees from them in year one": () => e.mkt_spend > 0 && sm(e.fees_mkt),
      "New matter type: fees − costs, year one": () => st.sim_new_area && sm(e.area_net),
      "New matter type at full speed, a year": () => st.sim_new_area && sm(e.area_net_full),
      "Launch campaign earned back after": () => st.sim_new_area && pb(e.area_payback),
      "Fee earners leaving: pay saved": () => st.sim_cut_fe > 0 && sm(e.cut_saving),
      "Fees lost (after work kept)": () => st.sim_cut_fe > 0 && sm(-e.fees_cut),
      "Support roles cut: pay saved a year": () => st.sim_cut_support > 0 && sm(e.support_saving),
      "New branch: fees − costs, year one": () => st.sim_branch && sm(e.branch_net),
      "New branch at full speed, a year": () => st.sim_branch && sm(e.branch_net_full),
      "Fit-out earned back after": () => st.sim_branch && pb(e.branch_payback),
      "Platform: first-year saving": () => e.platform_annual !== 0 && sm(e.platform_annual),
      "Redundancy pay (NES)": () => e.redundancy > 0 && `${money(e.redundancy)} · ${e.redundancy_weeks} weeks each`,
      "Notice pay": () => e.notice_pay > 0 && `${money(e.notice_pay)} · ${e.notice_weeks} weeks each`,
      "Branch fit-out": () => e.branch_fitout > 0 && money(e.branch_fitout),
      "Platform migration and go-live dip": () => e.platform_one_off > 0 && money(e.platform_one_off),
      "Launch campaign": () => e.area_launch > 0 && money(e.area_launch),
      "Cash from collecting faster or slower": () => e.dso_cash !== 0 && sm(e.dso_cash),
      "Office account today": () => money(C.CASH_NOW),
      "13-week low point: today → after": () => `${money(C.LOW0)} → ${money(e.low1)}`,
      "Cash cover after the decision": () => `${e.cash_cover.toFixed(1)} months`,
    };
    const f = rows[L]; const v = f ? f() : null; return v ? v : null;
  };
  // goal seek: how far each lever must move on its own, on top of the current levers
  const tgt = state.goalTarget || SIM.targets[0];
  const byMargin = /margin/i.test(tgt), extra = /extra|plus/i.test(tgt);
  const goal = byMargin ? C.BUDGET_MARGIN : (extra ? today + state.uplift : C.BUDGET_OP);
  const metric = s => byMargin ? simEval(s).margin1 : simEval(s).op1;
  const caps = {sim_util: [st.sim_util, (1 - C.UTIL0) * 100], sim_rate: [st.sim_rate, 30], sim_real: [st.sim_real, (1 - C.REAL0) * 100], sim_recov: [st.sim_recov, 30]};
  const req = {};
  for (const k in caps) req[k] = solve(v => metric({...st, [k]: v}), caps[k][0], caps[k][1], goal);
  const xi = solve(v => metric({...st, sim_infl: -v}), -st.sim_infl, 60, goal); req.sim_infl = xi === null ? null : -xi;
  const keyOf = l => Object.keys(SIM.goal).find(k => SIM.goal[k].label === l);
  M["Sim Goal Need"] = l => { const k = keyOf(l), x = req[k]; if (x === null) return "Not reachable on its own";
    const step = SIM.goal[k].bounds[2], xr = k === "sim_infl" ? Math.floor(x / step + 1e-9) * step : Math.ceil(x / step - 1e-9) * step, cur = st[k];
    const u = (k === "sim_rate" || k === "sim_infl") ? "%" : " pp";
    return Math.abs(xr - cur) < 1e-9 ? "Already met" : `${sgn1(xr)}${u} (${sgn1(xr - cur)}${u} from now)`; };
  M["Sim Goal Difficulty"] = l => { const k = keyOf(l), x = req[k], [lo, hi, step] = SIM.goal[k].bounds, cur = st[k];
    if (x === null) return "Not reachable on its own"; const ch = x - cur; if (Math.abs(ch) < 1e-9) return "Already met";
    const r = k === "sim_infl" ? Math.floor(x / step + 1e-9) * step : Math.ceil(x / step - 1e-9) * step;
    const fits = lo - 1e-9 <= r && r <= hi + 1e-9, span = k === "sim_infl" ? cur - lo : hi - Math.max(cur, 0), share = span > 0 ? Math.abs(ch) / span : 9;
    return fits && share <= 0.5 ? "Comfortable" : (fits ? "Stretch" : "Beyond a realistic range"); };
  M["Sim Goal Caption"] = () => { const have = metric(st), f = v => byMargin ? pct(v, 1) : money(v);
    const gap = byMargin ? `${((goal - have) * 100).toFixed(1)} pp short` : `${money(goal - have)} short`;
    return `Target: ${f(goal)}. Your scenario gives ${f(have)} (${have >= goal ? "already met" : gap}). Each line moves one lever on its own, on top of your current levers.`; };
  return (SIMM = M);
}
function liveData(v){
  const L = v.live, M = simM(), sk = L.skeleton;
  if (v.type === "card") return {...sk, value: M[L.measures[0]]()};
  if (v.type === "tableEx") {
    const rows = [];
    L.cats.forEach(c => { const vals = L.measures.map(m => M[m](c)); if (vals.some(x => x !== null && x !== undefined && x !== "")) rows.push([c, ...vals]); });
    return {...sk, rows, total: rows.length};
  }
  const cats = [], values = [], y2 = [];
  L.cats.forEach(c => { const x = M[L.measures[0]](c); if (x !== null && x !== undefined) { cats.push(c); values.push([[x]]); y2.push([]); } });
  return {...sk, cats, values, y2};
}
function leverOptions(lv){
  if (lv.kind === "cat") return lv.options.map(o => [o, o]);
  if (lv.kind === "bool") return [["false", "No"], ["true", "Yes"]];
  const n = Math.round((lv.hi - lv.lo) / lv.step), out = [];
  for (let i = 0; i <= n; i++) { const v = Math.round((lv.lo + i * lv.step) * 1e6) / 1e6;
    out.push([String(v), lv.fmt.includes("$") ? money(v) : (lv.fmt === "0" ? v.toFixed(0) : v.toFixed(1))]); }
  return out;
}

// ---------------------------------------------------------------------------------------------- visuals ---
function visual(v){
  const el = document.createElement("div"); el.className = "v";

  const d = dataFor(v); if (!d) return; const vals = d.values.map(r => r[0][0] || 0); const n = vals.length + 1;
  let run = 0; const segs = vals.map((x, i) => { const a = i === 0 ? 0 : run; run = i === 0 ? x : run + x; return { a, b: run, x, cat: d.cats[i] }; });
  segs.push({ a: 0, b: run, x: run, cat: "Total", total: true });
  const all = segs.flatMap(g => [g.a, g.b]); const sc = niceScale(Math.min(0, ...all), Math.max(...all));
  const s = svgEl(W, H); body.appendChild(s); const left = 48, top = 8, bottom = 22, pw = W - left - 8, ph = H - top - bottom, band = pw / n;
  const Y = y => top + (sc.hi - y) / (sc.hi - sc.lo) * ph;
  sc.ticks.forEach(t => { add(s,"line",{x1:left,x2:left+pw,y1:Y(t),y2:Y(t),stroke:"#eef2f6"}); add(s,"text",{x:left-5,y:Y(t)+3,"font-size":8,fill:"#64748b","text-anchor":"end"}, fmt(t, "money", true)); });
  segs.forEach((g, i) => { const col = g.total || i === 0 ? "#0a8496" : g.x >= 0 ? "#047857" : "#b91c1c";
    const r = add(s,"rect",{x:left+i*band+band*.15,y:Math.min(Y(g.a),Y(g.b)),width:band*.7,height:Math.max(1,Math.abs(Y(g.b)-Y(g.a))),fill:col,rx:2});
    hover(r, `${g.cat}: ${fmt(g.x, "money")}`);
    add(s,"text",{x:left+i*band+band/2,y:Math.min(Y(g.a),Y(g.b))-3,"font-size":8,fill:"#334155","text-anchor":"middle"}, fmt(g.x, "money", true));
    add(s,"text",{x:left+i*band+band/2,y:H-8,"font-size":8,fill:"#334155","text-anchor":"middle"}, g.cat); });
}
function scatter(v, body, W, H){
  const d = dataFor(v); if (!d) return; const pts = d.points.filter(p => p.x !== null && p.y !== null);
  const s = svgEl(W, H); body.appendChild(s); const left = 48, top = 8, bottom = 26, pw = W - left - 14, ph = H - top - bottom;
  const xs = niceScale(Math.min(...pts.map(p => p.x)), Math.max(...pts.map(p => p.x))), ys = niceScale(Math.min(0, ...pts.map(p => p.y)), Math.max(...pts.map(p => p.y)));
  const X = x => left + (x - xs.lo) / (xs.hi - xs.lo) * pw, Y = y => top + (ys.hi - y) / (ys.hi - ys.lo) * ph;
  ys.ticks.forEach(t => { add(s,"line",{x1:left,x2:left+pw,y1:Y(t),y2:Y(t),stroke:"#eef2f6"}); add(s,"text",{x:left-5,y:Y(t)+3,"font-size":8,fill:"#64748b","text-anchor":"end"}, fmt(t, d.ykind, true)); });
  xs.ticks.forEach(t => add(s,"text",{x:X(t),y:top+ph+12,"font-size":8,fill:"#64748b","text-anchor":"middle"}, fmt(t, d.xkind, true)));
  add(s,"text",{x:left+pw/2,y:H-2,"font-size":8,fill:"#64748b","text-anchor":"middle"}, d.xlabel);
  const mx = Math.max(...pts.map(p => p.size || 1));
  pts.forEach((p, i) => { const r = 4 + 12 * Math.sqrt((p.size || mx) / mx);
    const c = add(s,"circle",{cx:X(p.x),cy:Y(p.y),r,fill:PAL[i%PAL.length],opacity:.75}); hover(c, `${p.label}: ${d.xlabel} ${fmt(p.x, d.xkind)}, ${d.ylabel} ${fmt(p.y, d.ykind)}`);
    if (pts.length <= 12) add(s,"text",{x:X(p.x),y:Y(p.y)-r-2,"font-size":7.5,fill:"#334155","text-anchor":"middle"}, String(p.label).slice(0,18)); });
}

function geomap(v, body, W, H){
  const d = dataFor(v); if (!d) return; const bm = D.basemaps[d.basemap]; const [lon0, lat0, lon1, lat1] = bm.box;
  const s = svgEl(W, H); s.setAttribute("viewBox", `0 0 ${bm.w} ${bm.h}`); s.setAttribute("preserveAspectRatio", "xMidYMid meet"); body.appendChild(s); body.style.background = "#d9e9f1"; body.style.borderRadius = "0 0 12px 12px";
  add(s, "rect", {x:0, y:0, width:bm.w, height:bm.h, fill:"#d9e9f1"});
  add(s, "path", {d:bm.path, fill:"#f8fafc", stroke:"#b6c7d3", "stroke-width": d.basemap === "world" ? 0.6 : 1.2});
  const P = (la, lo) => [(lo - lon0) / (lon1 - lon0) * bm.w, (lat1 - la) / (lat1 - lat0) * bm.h];
  const k = Math.max(bm.w / W, bm.h / H);
  if (bm.cbd) { const [x, y] = P(bm.cbd[0], bm.cbd[1]); add(s,"circle",{cx:x,cy:y,r:4*k,fill:"#64748b"}); add(s,"text",{x:x,y:y+16*k,"font-size":10*k,fill:"#64748b","text-anchor":"middle"}, "Sydney CBD"); }
  const mx = Math.max(...d.points.map(p => p.size));
  const col = d.basemap === "world" ? "#0a8496" : "#2f7fd8";
  d.points.sort((a,b) => b.size - a.size).forEach(p => { const [x, y] = P(p.lat, p.lon); const r = (4 + Math.min(22, 0.08 * Math.min(W, H)) * Math.sqrt(p.size / mx)) * k;
    const c = add(s,"circle",{cx:x,cy:y,r,fill:col,"fill-opacity":.55,stroke:col,"stroke-width":1.2*k}); hover(c, `${p.label}: ${p.size} ${d.sizeLabel.toLowerCase()}`);
    if (p.size >= mx * 0.04 && p.size >= 8) add(s,"text",{x:x,y:y-r-4*k,"font-size":10*k,fill:"#0f172a","text-anchor":"middle","font-weight":600}, `${p.label} ${p.size}`); });
  add(s,"text",{x:bm.w-6*k,y:bm.h-6*k,"font-size":8*k,fill:"#94a3b8","text-anchor":"end"}, D.basemaps.attribution);
}

render();
</script>
